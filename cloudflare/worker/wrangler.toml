# Choose a unique name before deploying to your Cloudflare account.
name = "navonweb-signaling"
main = "src/index.mjs"
compatibility_date = "2026-08-03"
# This repository does not prescribe account-specific routes or custom domains.
# Add them in an untracked environment-specific configuration if needed.
workers_dev = true

[observability]
enabled = false

[durable_objects]
bindings = [
  { name = "SIGNAL_ROOMS", class_name = "SignalRoom" },
  { name = "PAIRING_BOOTSTRAP", class_name = "PairingBootstrap" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SignalRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["PairingBootstrap"]

[vars]
# Replace this example with the exact HTTPS origin(s) hosting the browser client.
# Separate multiple origins with commas. Wildcards are rejected.
ALLOWED_BROWSER_ORIGINS = "https://viewer.example.com"

# BOOTSTRAP_HMAC_KEY is deliberately not stored in this file. Configure a
# random value of at least 32 bytes with `wrangler secret put BOOTSTRAP_HMAC_KEY`.
# Bare-URL pairing fails closed when the secret is absent.
